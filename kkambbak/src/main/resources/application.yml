spring:
  application:
    name: kkambbak

  config:
    import: optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-google-client-secret}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET:test-jwt-secret-key-for-testing-minimum-256-bits-required-for-hs256-algorithm-security}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:86400000}

app:
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  email:
    redirect-uri: ${EMAIL_REDIRECT_URI:http://localhost:3000/verify-email}
    otp-expiry-minutes: ${EMAIL_OTP_EXPIRY_MINUTES:5}
  auth:
    key: ${AUTH_KEY:test-auth-key-1234}

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:test-account-id}
    access-key: ${R2_ACCESS_KEY:test-access-key}
    secret-key: ${R2_SECRET_KEY:test-secret-key}
    bucket-name: ${R2_BUCKET_NAME:kkambbak-images}
    public-domain: ${R2_PUBLIC_DOMAIN:https://pub-test.r2.dev}