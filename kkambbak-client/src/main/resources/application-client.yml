spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-google-client-secret}
            scope:
              - email
              - profile

cloudflare:
  r2:
    account-id: ${R2_ACCOUNT_ID:test-account-id}
    access-key: ${R2_ACCESS_KEY:test-access-key}
    secret-key: ${R2_SECRET_KEY:test-secret-key}
    bucket-name: ${R2_BUCKET_NAME:kkambbak-images}
    public-domain: ${R2_PUBLIC_DOMAIN:https://pub-test.r2.dev}

discord:
  scheduler:
    webhook:
      url: ${DISCORD_SCHEDULER_WEBHOOK_URL:}