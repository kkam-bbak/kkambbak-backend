version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kkambbak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - kkambbak-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ${DOCKERHUB_USERNAME}/kkambbak:latest
    container_name: kkambbak
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kkambbak-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    image: ${DOCKERHUB_USERNAME}/kkambbak-scheduler:latest
    container_name: kkambbak-scheduler
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      app:
        condition: service_started
    networks:
      - kkambbak-network

networks:
  kkambbak-network:
    driver: bridge

volumes:
  redis-data: