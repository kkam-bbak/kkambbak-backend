version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kkambbak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - kkambbak-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    image: ${DOCKERHUB_USERNAME}/kkambbak:${IMAGE_TAG:-latest}
    container_name: kkambbak
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kkambbak-network

  scheduler:
    image: ${DOCKERHUB_USERNAME}/kkambbak-scheduler:${IMAGE_TAG:-latest}
    container_name: kkambbak-scheduler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_started
    networks:
      - kkambbak-network

  prometheus:
    image: prom/prometheus:latest
    container_name: kkambbak-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=${PROMETHEUS_URL}'
      - '--web.route-prefix=/'
    networks:
      - kkambbak-network

  loki:
    image: grafana/loki:latest
    container_name: kkambbak-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - kkambbak-network

  promtail:
    image: grafana/promtail:latest
    container_name: kkambbak-promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/app
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - kkambbak-network

  grafana:
    image: grafana/grafana:latest
    container_name: kkambbak-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_URL}
    depends_on:
      - prometheus
      - loki
    networks:
      - kkambbak-network

networks:
  kkambbak-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data: