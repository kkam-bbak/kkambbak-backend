version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kkambbak-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-kkambbak}
      POSTGRES_USER: ${DB_USERNAME:-kkambbak}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kkambbak123}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kkambbak-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-kkambbak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kkambbak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - kkambbak-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: ${DOCKERHUB_USERNAME}/kkambbak:latest
    container_name: kkambbak
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kkambbak-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    image: ${DOCKERHUB_USERNAME}/kkambbak-scheduler:latest
    container_name: kkambbak-scheduler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      app:
        condition: service_started
    networks:
      - kkambbak-network

networks:
  kkambbak-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: