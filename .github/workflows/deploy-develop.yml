name: CI Pipeline for Development

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --parallel

      - name: Build with Gradle
        run: ./gradlew :kkambbak:assemble :kkambbak-scheduler:assemble --no-daemon --parallel

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            kkambbak/build/libs/*.jar
            kkambbak-scheduler/build/libs/*.jar

      - name: Upload monitoring configs
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-configs
          path: monitoring/

  dockerize:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ./

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kkambbak:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Scheduler image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: scheduler
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kkambbak-scheduler:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download monitoring configs
        uses: actions/download-artifact@v4
        with:
          name: monitoring-configs
          path: ./monitoring

      - name: Upload monitoring configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_SSH_KEY }}
          password: ${{ secrets.NCP_PASSWORD }}
          source: "./monitoring/*"
          target: "/home/ubuntu/kkambbak/"
          strip_components: 0

      - name: Deploy to Naver Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NCP_HOST }}
          username: ${{ secrets.NCP_USERNAME }}
          key: ${{ secrets.NCP_SSH_KEY }}
          password: ${{ secrets.NCP_PASSWORD }}
          script: |
            # .env 파일 생성
            cat > /tmp/.env <<'EOF'
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DRIVER=${{ secrets.DB_DRIVER }}
            JPA_DDL_AUTO=${{ secrets.JPA_DDL_AUTO }}
            JPA_DIALECT=${{ secrets.JPA_DIALECT }}
            REDIS_HOST=kkambbak-redis
            REDIS_PORT=6379
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_ACCESS_TOKEN_EXPIRATION=${{ secrets.JWT_ACCESS_TOKEN_EXPIRATION }}
            JWT_REFRESH_TOKEN_EXPIRATION=${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            OAUTH2_REDIRECT_URI=${{ secrets.OAUTH2_REDIRECT_URI }}
            AUTH_KEY=${{ secrets.AUTH_KEY }}
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_SMTP_AUTH=true
            MAIL_SMTP_STARTTLS_ENABLE=true
            EMAIL_REDIRECT_URI=${{ secrets.EMAIL_REDIRECT_URI }}
            EMAIL_OTP_EXPIRY_MINUTES=${{ secrets.EMAIL_OTP_EXPIRY_MINUTES }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY=${{ secrets.R2_ACCESS_KEY }}
            R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            R2_PUBLIC_DOMAIN=${{ secrets.R2_PUBLIC_DOMAIN }}
            DEFAULT_PROFILE_IMAGE=${{ secrets.DEFAULT_PROFILE_IMAGE }}
            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK }}
            DISCORD_SCHEDULER_WEBHOOK_URL=${{ secrets.DISCORD_SCHEDULER_WEBHOOK_URL }}
            GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            EOF

            # Docker 로그인
            echo ${{ secrets.DOCKERHUB_TOKEN }} | /usr/bin/docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # 최신 이미지 pull
            /usr/bin/docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kkambbak:develop
            /usr/bin/docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kkambbak-scheduler:develop

            # Docker 네트워크 생성 (없으면)
            /usr/bin/docker network create kkambbak-network || true

            # Redis 데이터 볼륨 생성 (없으면)
            /usr/bin/docker volume create redis-data || true

            # 기존 Redis 컨테이너 중지 및 제거
            /usr/bin/docker stop kkambbak-redis || true
            /usr/bin/docker rm kkambbak-redis || true

            # Redis 컨테이너 실행 (데이터 보존)
            /usr/bin/docker run -d \
              --name kkambbak-redis \
              --restart unless-stopped \
              -p 6379:6379 \
              --network kkambbak-network \
              -v redis-data:/data \
              redis:7-alpine redis-server --appendonly yes

            # 기존 애플리케이션 컨테이너 중지 및 제거
            /usr/bin/docker stop kkambbak || true
            /usr/bin/docker rm kkambbak || true

            # 로그 디렉토리 생성
            mkdir -p /home/ubuntu/kkambbak/logs

            # 애플리케이션 컨테이너 실행 (포트 8080)
            /usr/bin/docker run -d \
              --name kkambbak \
              --restart unless-stopped \
              --network kkambbak-network \
              -p 8080:8080 \
              -v /home/ubuntu/kkambbak/logs:/app/logs \
              --env-file /tmp/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/kkambbak:develop

            # 기존 스케줄러 컨테이너 중지 및 제거
            /usr/bin/docker stop kkambbak-scheduler || true
            /usr/bin/docker rm kkambbak-scheduler || true

            # 스케줄러 컨테이너 실행
            /usr/bin/docker run -d \
              --name kkambbak-scheduler \
              --restart unless-stopped \
              --network kkambbak-network \
              -v /home/ubuntu/kkambbak/logs:/app/logs \
              --env-file /tmp/.env \
              ${{ secrets.DOCKERHUB_USERNAME }}/kkambbak-scheduler:develop

            # 모니터링 스택 배포

            # 기존 모니터링 컨테이너 중지 및 제거
            /usr/bin/docker stop kkambbak-prometheus || true
            /usr/bin/docker rm kkambbak-prometheus || true
            /usr/bin/docker stop kkambbak-loki || true
            /usr/bin/docker rm kkambbak-loki || true
            /usr/bin/docker stop kkambbak-promtail || true
            /usr/bin/docker rm kkambbak-promtail || true
            /usr/bin/docker stop kkambbak-grafana || true
            /usr/bin/docker rm kkambbak-grafana || true

            # 모니터링 볼륨 생성
            /usr/bin/docker volume create prometheus-data || true
            /usr/bin/docker volume create loki-data || true
            /usr/bin/docker volume create grafana-data || true

            # Prometheus 실행
            /usr/bin/docker run -d \
              --name kkambbak-prometheus \
              --restart unless-stopped \
              --network kkambbak-network \
              -p 9090:9090 \
              -v /home/ubuntu/kkambbak/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml \
              -v prometheus-data:/prometheus \
              prom/prometheus:latest \
              --config.file=/etc/prometheus/prometheus.yml \
              --storage.tsdb.path=/prometheus \
              --web.external-url=${{ secrets.PROMETHEUS_URL }} \
              --web.route-prefix=/

            # Loki 실행
            /usr/bin/docker run -d \
              --name kkambbak-loki \
              --restart unless-stopped \
              --network kkambbak-network \
              -p 3100:3100 \
              -v /home/ubuntu/kkambbak/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml \
              -v loki-data:/loki \
              grafana/loki:latest \
              -config.file=/etc/loki/local-config.yaml

            # Loki & Prometheus IP 주소 
            sleep 2
            LOKI_IP=$(/usr/bin/docker inspect kkambbak-loki -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
            PROMETHEUS_IP=$(/usr/bin/docker inspect kkambbak-prometheus -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')

            # Promtail 설정 생성
            /bin/sed -i "s|http://loki:3100|http://${LOKI_IP}:3100|g" /home/ubuntu/kkambbak/monitoring/promtail/promtail-config.yml

            # Prometheus 설정 생성
            /bin/sed -i "s|prometheus:9090|${PROMETHEUS_IP}:9090|g" /home/ubuntu/kkambbak/monitoring/prometheus/prometheus.yml

            # Grafana 데이터소스 설정 생성
            /bin/sed "s|http://prometheus:9090|http://${PROMETHEUS_IP}:9090|g; s|http://loki:3100|http://${LOKI_IP}:3100|g" /home/ubuntu/kkambbak/monitoring/grafana/provisioning/datasources/datasources.yml > /tmp/datasources.yml
            mv /tmp/datasources.yml /home/ubuntu/kkambbak/monitoring/grafana/provisioning/datasources/datasources.yml

            # Promtail 실행
            /usr/bin/docker run -d \
              --name kkambbak-promtail \
              --restart unless-stopped \
              --network kkambbak-network \
              -v /home/ubuntu/kkambbak/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml \
              -v /home/ubuntu/kkambbak/logs:/var/log/app \
              grafana/promtail:latest \
              -config.file=/etc/promtail/config.yml

            # Grafana 실행
            /usr/bin/docker run -d \
              --name kkambbak-grafana \
              --restart unless-stopped \
              --network kkambbak-network \
              -p 3001:3000 \
              -v grafana-data:/var/lib/grafana \
              -v /home/ubuntu/kkambbak/monitoring/grafana/provisioning:/etc/grafana/provisioning \
              -e GF_SECURITY_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }} \
              -e GF_SECURITY_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
              -e GF_USERS_ALLOW_SIGN_UP=false \
              -e GF_SERVER_ROOT_URL=${{ secrets.GRAFANA_URL }} \
              grafana/grafana:latest

            # 사용하지 않는 이미지 정리
            /usr/bin/docker image prune -af

      - name: Notify Discord (배포 성공)
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [
                {
                  "color": 65280,
                  "title": "✅ 개발 서버 배포 성공!",
                  "fields": [
                    {
                      "name": "Repository",
                      "value": "'"${GITHUB_REPOSITORY}"'",
                      "inline": true
                    },
                    {
                      "name": "Branch",
                      "value": "'"${GITHUB_REF##*/}"'",
                      "inline": true
                    },
                    {
                      "name": "Commit",
                      "value": "'"${GITHUB_SHA:0:7}"'",
                      "inline": true
                    }
                  ]
                }
              ]
            }' ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notify Discord (배포 실패)
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [
                {
                  "color": 16711680,
                  "title": "❌ 개발 서버 배포 실패!",
                  "fields": [
                    {
                      "name": "Repository",
                      "value": "'"${GITHUB_REPOSITORY}"'",
                      "inline": true
                    },
                    {
                      "name": "Branch",
                      "value": "'"${GITHUB_REF##*/}"'",
                      "inline": true
                    },
                    {
                      "name": "Commit",
                      "value": "'"${GITHUB_SHA:0:7}"'",
                      "inline": true
                    }
                  ]
                }
              ]
            }' ${{ secrets.DISCORD_WEBHOOK }}